<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="spellDB.css" />
    <title>Spell</title>
</head>

<body>

    <a href="spell-compendium.html">← Back to Spell Compendium</a>

    <main id="spell"></main>

    <script>

        const params = new URLSearchParams(window.location.search);

        const id = Number(params.get("id"));

        fetch("spells.json")
            .then(response => response.json())
            .then(spells => {

                const spell = spells.find(spell => spell.id === id);

                const container = document.getElementById("spell");

                if (!spell) {

                    container.innerHTML = `
                        <h1>Spell not found</h1>
                    `;

                    return;
                }

                const levelText =
                    spell.level === 0
                        ? "Cantrip"
                        : `Level ${spell.level}`;

                container.innerHTML = `

                    <h1>${spell.name}</h1>

                    <h2>
                        Level ${levelText} ${spell.school}
                    </h2>

                    <hr>

                    <p>
                        <strong>Casting Time:</strong>
                        ${spell.castingTime}
                    </p>

                    <p>
                        <strong>Range:</strong>
                        ${spell.range}
                    </p>

                    <p>
                        <strong>Components:</strong>
                        ${spell.components}
                    </p>

                    <p>
                        <strong>Duration:</strong>
                        ${spell.duration}
                    </p>

                    <p>
                        <strong>Classes:</strong>
                        ${spell.classes.join(", ")}
                    </p>

                    <hr>

                    <h2>Description</h2>

                    <p>
                        ${spell.description}
                    </p>
                `;

                document.title = spell.name;

            })
            .catch(error => {
                console.error("Could not load spells:", error);
            });

    </script>

</body>

</html>
