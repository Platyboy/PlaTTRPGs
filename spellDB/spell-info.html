<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>spell</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="index.html">← Back to spells</a>

    <div id="spell"></div>

    <script>

        const params = new URLSearchParams(window.location.search);
        const id = Number(params.get("id"));

        fetch("spells.json")
            .then(response => response.json())
            .then(spells => {

                const spell = spells.find(spell => spell.id === id);

                if (!spell) {
                    document.getElementById("spell").innerHTML =
                        "<h1>spell not found</h1>";

                    return;
                }

                document.getElementById("spell").innerHTML = `
                    <img
                        class="detail-image"
                        src="${spell.image}"
                        alt="${spell.name}"
                    >

                    <h1>${spell.name}</h1>

                    <p><strong>Category:</strong> ${spell.category}</p>

                    <p>${spell.description}</p>
                `;

                document.title = spell.name;
            });

    </script>

</body>
</html>
