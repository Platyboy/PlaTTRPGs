<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spell Info/title>
</head>
<body>
    <header>
        <h1>Spell Info</h1>
        <a href="spell-compendium.html">Back to Spell Compendium</a>
    </header>
    <main>
        <article id="spell-detail">
            <section id="spell-header">
                <h1 id="spell-name"></h1>
                <p id="spell-level-school"> Spell Level • School </p>
                <div id="spell-tags"> <!-- Tags go here --> </div>
            </section>

            <section id="spell-properties">
                <div>
                    <strong>Casting Time</strong>
                    <span id="casting-time"></span>
                </div>
                <div>
                    <strong>Range</strong>
                    <span id="range"></span>
                </div>
                <div>
                    <strong>Components</strong>
                    <span id="components"></span>
                </div>
                <div>
                    <strong>Duration</strong>
                    <span id="duration"></span>
                </div>
                <div>
                    <strong>Classes</strong>
                    <span id="classes"></span>
                </div>
            </section>

            <section id="spell-description">
                <h2 id="description"></h2>
                <div id="description"> <!-- Spell description --> </div>
            </section>
        </article>
    </main>
    <script src="info-logic.js"></script>
</body>
